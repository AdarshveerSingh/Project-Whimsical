<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghibli Meadow</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8e6; }
  canvas { display: block; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
    font: 14px/1.2 Georgia, 'Times New Roman', serif; color: #fff; text-shadow: 0 1px 6px rgba(20,60,40,.7); pointer-events: none; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="hint">drag to look around · scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var HORIZON = new THREE.Color(0.62, 0.85, 0.90);
  var SUN = new THREE.Vector3(0.0, 0.33, -1.0).normalize();

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement); 

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(HORIZON, 30, 180);
  var camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);

  // seeded rng
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function rr(a, b) { return a + (b - a) * rnd(); }

  function hAt(x, z) {
    return Math.sin(x * 0.045) * Math.cos(z * 0.04) * 3.2 + Math.sin(x * 0.1 + z * 0.08) * 0.8;
  }

  // ---------- Sky ----------
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { time: { value: 0 }, sunDir: { value: SUN }, horizon: { value: new THREE.Vector3(HORIZON.r, HORIZON.g, HORIZON.b) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: [
      'varying vec3 vP; uniform float time; uniform vec3 sunDir; uniform vec3 horizon;',
      'float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',
      'float vn(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);',
      ' return mix(mix(mix(h3(i),h3(i+vec3(1.,0.,0.)),f.x), mix(h3(i+vec3(0.,1.,0.)),h3(i+vec3(1.,1.,0.)),f.x),f.y),',
      '            mix(mix(h3(i+vec3(0.,0.,1.)),h3(i+vec3(1.,0.,1.)),f.x), mix(h3(i+vec3(0.,1.,1.)),h3(i+vec3(1.,1.,1.)),f.x),f.y), f.z); }',
      'float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }',
      'const vec2 T1 = vec2(-0.64,-0.77);',
      'const vec2 T2 = vec2(0.78,0.62);',
      'float field(vec3 d){',
      ' vec3 q = vec3(d.x, d.y*1.9, d.z)*2.2 + vec3(time*.01,0.,0.);',
      ' q += (vec3(vn(q*.9+3.1), vn(q*.9+7.7), vn(q*.9+1.3)) - .5)*.9;',
      ' float n = fbm(q);',
      ' vec2 hd = normalize(d.xz + 1e-4);',
      ' float env = pow(max(dot(hd,T1),0.),5.) + .55*pow(max(dot(hd,T2),0.),8.);',
      ' float yy = max(d.y,0.);',
      ' float hp = 1. - smoothstep(.1,.85,yy);',
      ' float bank = 1. - smoothstep(0.,.3,yy);',
      ' return n + env*.55*hp + bank*.12 - .24; }',
      'float fbm3(vec3 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vn(p); p=p*2.1+vec3(4.3,1.1,7.7); a*=.5; } return s; }',
      'float ridge(vec2 hd, float k, float sd){ vec2 p=hd*k; float n=0., a=.5; for(int i=0;i<3;i++){ n+=a*(1.-abs(2.*vn(vec3(p,sd))-1.)); p*=2.1; a*=.5; } return n; }',
      'float puff(vec3 d){',
      ' vec3 q = vec3(d.x, d.y*3.2, d.z)*6.5 + vec3(time*.02,0.,0.);',
      ' float cover = vn(vec3(d.x,d.y*1.5,d.z)*2.3+9.1);',
      ' return fbm3(q) + (cover-.5)*.7; }',
      'void main(){',
      ' vec3 d = normalize(vP); float y = max(d.y,0.);',
      ' vec3 sky = mix(horizon, vec3(.10,.62,.82), smoothstep(0.,.3,y));',
      ' sky = mix(sky, vec3(.01,.38,.60), smoothstep(.25,.95,y));',
      ' sky = mix(sky, vec3(.85,.95,.98), (1.-smoothstep(0.,.12,y))*.3);',
      ' float sd = max(dot(d,sunDir),0.);',
      ' sky += vec3(1.,.93,.75)*(pow(sd,18.)*.14 + pow(sd,160.)*.5);',
      ' sky = mix(sky, vec3(1.,.99,.94), smoothstep(.99935,.9996,sd));',
      ' vec3 col = sky;',
      ' if (d.y < .14) {',
      '  vec2 hd = normalize(d.xz + 1e-4);',
      '  vec3 haze = horizon; float bm = smoothstep(.02,-.04,d.y)*.85;',
      '  float t = pow(ridge(hd,2.2,1.),2.2)*.16 + .01;',
      '  col = mix(col, mix(vec3(.70,.86,.95),haze,bm), 1.-smoothstep(t-.002,t+.002,d.y));',
      '  t = pow(ridge(hd,3.6,5.),2.4)*.12 + .005;',
      '  col = mix(col, mix(vec3(.58,.79,.93),haze,bm), 1.-smoothstep(t-.002,t+.002,d.y));',
      '  t = pow(ridge(hd,6.5,9.),2.2)*.07;',
      '  col = mix(col, mix(vec3(.50,.74,.91),haze,bm), 1.-smoothstep(t-.002,t+.002,d.y));',
      ' }',
      ' if (y < .5) {',
      '  float w = vn(vec3(d.x*3.,d.y*22.,d.z*3.)+vec3(time*.01,0.,0.))*.6 + vn(vec3(d.x*7.,d.y*40.,d.z*7.))*.4;',
      '  float wa = smoothstep(.55,.8,w)*smoothstep(.02,.1,y)*(1.-smoothstep(.2,.45,y))*.5;',
      '  col = mix(col, vec3(1.,.98,.95), wa); }',
      ' if (d.y > .03) {',
      '  float g = puff(d); float g2 = puff(normalize(d + sunDir*.05));',
      '  float pa = smoothstep(.64,.67,g)*smoothstep(.03,.12,d.y)*(1.-smoothstep(.75,1.,d.y));',
      '  float pl = clamp((g-g2)*8.+.7, 0., 1.);',
      '  col = mix(col, mix(vec3(.62,.78,.95), vec3(1.,.97,.92), pl), pa); }',
      ' float f = field(d);',
      ' float f2 = field(normalize(d + sunDir*.09));',
      ' float a = smoothstep(.5,.55,f) * smoothstep(-.05,.06,d.y);',
      ' float lit = clamp((f-f2)*7. + .62 + (y-.3)*.25, 0., 1.);',
      ' vec3 sh = vec3(.30,.60,.78); vec3 md = vec3(.72,.87,.93); vec3 li = vec3(.99,.96,.86);',
      ' vec3 c = lit < .5 ? mix(sh,md,lit*2.) : mix(md,li,(lit-.5)*2.);',
      ' c = mix(c, sh*.95, smoothstep(.7,1.,f)*.4);',
      ' c += (fract(sin(dot(gl_FragCoord.xy,vec2(12.9,78.2)))*43758.5)-.5)*.02;',
      ' gl_FragColor = vec4(mix(col,c,a),1.); }'
    ].join('\n')
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
  sky.renderOrder = -1;
  scene.add(sky);

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6a9a50, 0.85));
  var sun = new THREE.DirectionalLight(0xfff1d0, 0.9);
  sun.position.copy(SUN).multiplyScalar(100);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera; sc.left = -70; sc.right = 70; sc.top = 70; sc.bottom = -70; sc.near = 1; sc.far = 250;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---------- Ground ----------
  var gg = new THREE.PlaneGeometry(400, 400, 160, 160);
  gg.rotateX(-Math.PI / 2);
  var gp = gg.attributes.position, cols = [];
  for (var i = 0; i < gp.count; i++) {
    var x = gp.getX(i), z = gp.getZ(i);
    gp.setY(i, hAt(x, z));
    var t = 0.5 + 0.5 * Math.sin(x * 0.08) * Math.sin(z * 0.07);
    cols.push(0.14 + 0.1 * t, 0.40 + 0.1 * t, 0.15);
  }
  gg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  gg.computeVertexNormals();
  var ground = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- Grass ----------
  var bg = new THREE.PlaneGeometry(0.2, 1, 1, 3);
  bg.translate(0, 0.5, 0);
  var bp = bg.attributes.position;
  for (var i = 0; i < bp.count; i++) {
    var y = bp.getY(i);
    bp.setX(i, bp.getX(i) * (1 - y * 0.92));
    bp.setZ(i, y * y * 0.25);
  }
  var N = 90000;
  var grassMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { time: { value: 0 }, fogColor: { value: HORIZON }, fogNear: { value: 30 }, fogFar: { value: 180 } },
    vertexShader: [
      'uniform float time; varying float vH; varying vec3 vW; varying float vD;',
      'void main(){ float h = position.y;',
      ' vec4 wp = instanceMatrix * vec4(position,1.);',
      ' float w = sin(wp.x*.3+time*1.5)*.5 + sin(wp.z*.4+time*1.1)*.5;',
      ' wp.x += w*h*h*.4; wp.z += cos(wp.x*.2+time)*h*h*.2;',
      ' vH = h; vW = wp.xyz;',
      ' vec4 mv = viewMatrix * wp; vD = -mv.z; gl_Position = projectionMatrix * mv; }'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 fogColor; uniform float fogNear, fogFar; varying float vH; varying vec3 vW; varying float vD;',
      'void main(){',
      ' float patch = .5 + .5*sin(vW.x*.09)*sin(vW.z*.11);',
      ' vec3 base = mix(vec3(.10,.34,.14), vec3(.16,.40,.16), patch);',
      ' vec3 tip = mix(vec3(.55,.80,.24), vec3(.80,.88,.32), patch);',
      ' vec3 c = mix(base, tip, smoothstep(0.,1.,vH));',
      ' c = mix(c, fogColor, smoothstep(fogNear, fogFar, vD));',
      ' gl_FragColor = vec4(c,1.); }'
    ].join('\n')
  });
  var grass = new THREE.InstancedMesh(bg, grassMat, N);
  var d = new THREE.Object3D();
  for (var i = 0; i < N; i++) {
    var r = 75 * Math.pow(rnd(), 0.65), a = rnd() * 6.2832;
    var x = Math.cos(a) * r, z = Math.sin(a) * r;
    d.position.set(x, hAt(x, z) - 0.05, z);
    d.rotation.set(0, rnd() * 6.2832, 0);
    var s = 0.7 + 0.9 * (0.5 + 0.5 * Math.sin(x * 0.2) * Math.cos(z * 0.2)) + rnd() * 0.4;
    d.scale.set(1 + rnd() * 0.6, s, 1);
    d.updateMatrix();
    grass.setMatrixAt(i, d.matrix);
  }
  grass.frustumCulled = false;
  scene.add(grass);

  // ---------- Toon materials ----------
  var gradTex = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.LuminanceFormat);
  gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter; gradTex.needsUpdate = true;
  function toon(c) { return new THREE.MeshToonMaterial({ color: c, gradientMap: gradTex }); }
  var leafCols = [0x3f9a3c, 0x4fae45, 0x2f8a3e, 0x66b84a].map(toon);
  var bushCols = [0x3a9a4a, 0x57b04c, 0x2e8447].map(toon);
  var trunkMat = toon(0x7a5230);

  function placeOk(x, z, minR) { return Math.sqrt(x * x + z * z) > minR; }

  function makeTree(x, z, s) {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.5, 4.5, 7), trunkMat);
    trunk.position.y = 2.2; trunk.castShadow = true; g.add(trunk);
    var n = 6 + Math.floor(rnd() * 3);
    for (var i = 0; i < n; i++) {
      var rad = rr(1.5, 2.4);
      var b = new THREE.Mesh(new THREE.IcosahedronGeometry(rad, 2), leafCols[Math.floor(rnd() * leafCols.length)]);
      b.position.set(rr(-1.8, 1.8), 5 + rr(-0.6, 1.8), rr(-1.8, 1.8));
      b.castShadow = true; g.add(b);
    }
    g.position.set(x, hAt(x, z) - 0.2, z);
    g.scale.setScalar(s); g.rotation.y = rnd() * 6;
    scene.add(g);
  }
  makeTree(-9, -6, 1.7); // hero tree
  for (var i = 0; i < 16; i++) {
    var a = rnd() * 6.28, r = rr(18, 80), x = Math.cos(a) * r, z = Math.sin(a) * r;
    makeTree(x, z, rr(0.9, 1.6));
  }

  for (var i = 0; i < 28; i++) {
    var a = rnd() * 6.28, r = rr(6, 60), x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!placeOk(x - 3, z, 4)) continue;
    var g = new THREE.Group(), n = 3 + Math.floor(rnd() * 3), m = bushCols[Math.floor(rnd() * 3)];
    for (var k = 0; k < n; k++) {
      var b = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(0.7, 1.2), 2), m);
      b.position.set(rr(-1, 1), rr(0.3, 0.9), rr(-1, 1)); b.castShadow = true; g.add(b);
    }
    g.position.set(x, hAt(x, z) - 0.1, z); scene.add(g);
  }

  var stoneMat = new THREE.MeshLambertMaterial({ color: 0x8c9a95, flatShading: true });
  var stoneMat2 = new THREE.MeshLambertMaterial({ color: 0x9aa59a, flatShading: true });
  for (var i = 0; i < 26; i++) {
    var a = rnd() * 6.28, r = rr(4, 55), x = Math.cos(a) * r, z = Math.sin(a) * r, cl = 1 + Math.floor(rnd() * 3);
    for (var k = 0; k < cl; k++) {
      var s = rr(0.3, 1.2) * (k ? 0.6 : 1);
      var st = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), rnd() > 0.5 ? stoneMat : stoneMat2);
      var px = x + rr(-1.2, 1.2), pz = z + rr(-1.2, 1.2);
      st.scale.set(s * rr(1, 1.5), s * 0.65, s * rr(0.9, 1.3));
      st.rotation.set(rr(-.3, .3), rnd() * 6, rr(-.3, .3));
      st.position.set(px, hAt(px, pz) + s * 0.05, pz);
      st.castShadow = st.receiveShadow = true; scene.add(st);
    }
  }

  // ---------- Flowers ----------
  var FN = 1400;
  var flowers = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.12, 0), new THREE.MeshBasicMaterial(), FN);
  var fc = [0xffffff, 0xffe66b, 0xff9ec4, 0xb9a6ff, 0xffffff], col = new THREE.Color();
  for (var i = 0; i < FN; i++) {
    var a = rnd() * 6.28, r = 55 * Math.pow(rnd(), 0.7), x = Math.cos(a) * r, z = Math.sin(a) * r;
    d.position.set(x, hAt(x, z) + rr(0.55, 1.1), z); d.rotation.set(0, 0, 0); d.scale.setScalar(rr(0.8, 1.6)); d.updateMatrix();
    flowers.setMatrixAt(i, d.matrix);
    flowers.setColorAt(i, col.setHex(fc[Math.floor(rnd() * fc.length)]));
  }
  scene.add(flowers);

  // ---------- Pollen ----------
  var PN = 160, pg = new THREE.BufferGeometry(), pa = new Float32Array(PN * 3), pb = [];
  for (var i = 0; i < PN; i++) { pa[i*3] = rr(-40, 40); pa[i*3+1] = rr(1, 14); pa[i*3+2] = rr(-40, 40); pb.push(rnd() * 6); }
  pg.setAttribute('position', new THREE.BufferAttribute(pa, 3));
  var pollen = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xfff6c0, size: 0.28, transparent: true, opacity: 0.85, depthWrite: false }));
  scene.add(pollen);

  // ---------- Camera control ----------
  var yaw = 0.6, pitch = 0.12, dist = 26, drag = false, lx = 0, ly = 0, idle = 0;
  var cv = renderer.domElement;
  cv.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', function () { drag = false; idle = 0; });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    yaw -= (e.clientX - lx) * 0.005; pitch += (e.clientY - ly) * 0.004;
    pitch = Math.max(-0.05, Math.min(0.9, pitch)); lx = e.clientX; ly = e.clientY;
  });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); dist = Math.max(8, Math.min(55, dist + e.deltaY * 0.02)); }, { passive: false });
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });

  var clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    var t = clock.getElapsedTime(), dt = clock.getDelta();
    if (!drag) yaw += 0.0012;
    var tx = -3, tz = -2, ty = hAt(tx, tz) + 4;
    var cx = tx + Math.sin(yaw) * Math.cos(pitch) * dist, cz = tz + Math.cos(yaw) * Math.cos(pitch) * dist;
    var cy = Math.max(ty + Math.sin(pitch) * dist, hAt(cx, cz) + 1.8);
    camera.position.set(cx, cy, cz);
    camera.lookAt(tx, ty, tz);
    sky.position.copy(camera.position);
    skyMat.uniforms.time.value = t; grassMat.uniforms.time.value = t;
    for (var i = 0; i < PN; i++) {
      pa[i*3] += Math.sin(t * 0.5 + pb[i]) * 0.01 + 0.012;
      pa[i*3+1] += Math.sin(t * 0.7 + pb[i] * 2) * 0.008;
      pa[i*3+2] += Math.cos(t * 0.4 + pb[i]) * 0.01;
      if (pa[i*3] > 40) pa[i*3] = -40;
    }
    pg.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
  }
  loop();
})();
</script>
</body>
</html>
